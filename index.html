  .rule { height: 1px; background: #d9ddd5; margin: 18px 0; }
  .field { margin: 17px 0; }
  .label { font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: #758071; margin-bottom: 5px; }
  .value { font-size: 14px; line-height: 1.5; }
  .pill { display: inline-block; padding: 6px 10px; border-radius: 99px; background: #dfe6da; color: #344a36; font-size: 11px; letter-spacing: .03em; }
  .hint { font-size: 12px; line-height: 1.5; color: #697266; }
  .mapboxgl-popup-content { font: 13px "ASAP", "Asap", Arial, sans-serif; }
  @media (max-width: 680px) {
    #archive { grid-template-columns: 1fr; grid-template-rows: 55% 45%; height: 100%; }

  const map = new mapboxgl.Map({
    container: 'map',
    style: MAP_STYLE,
    center: [-98.5, 39.8],
    zoom: 3.8960
  });
  map.addControl(new mapboxgl.NavigationControl(), 'top-left');
  // Recalculate the canvas when the embed is resized.
  new ResizeObserver(() => map.resize()).observe(document.getElementById('archive'));
   function showCourse(properties) {
    const p = properties || {};

    document.getElementById('course-name').textContent =
        p['Course'] || 'Unnamed course';

    document.getElementById('course-location').textContent =
        [p.City, p.State].filter(Boolean).join(', ');

    document.getElementById('architect').textContent =
        p['Architect(s)'] || 'Not listed';

    document.getElementById('year-built').textContent =
        p['Year Built'] ?? 'Not listed';

    document.getElementById('last-visited').textContent =
        p['Last Visited'] ?? 'Not listed';

    document.getElementById('relationship').textContent =
    p['Played/Seen/Worked'] || 'Not specified';

};

  map.on('load', () => {
    map.addSource('courses', { type: 'geojson', data: courseData });
    // Preserve the published Mapbox Studio style exactly: do not add a custom visual layer.
    // Find the course marker layer(s) already defined in the published style.
    const styleLayers = map.getStyle().layers || [];
    const courseLayers = styleLayers.filter(layer => {
      if (!['circle', 'symbol'].includes(layer.type)) return false;
      const source = map.getSource(layer.source);
      return source && layer.source !== 'courses' &&
        /course|golf|point|marker|location/i.test([layer.id, layer['source-layer'] || '', layer.source].join(' '));
    }).map(layer => layer.id);

    // An invisible hit target enables the sidebar without changing any Mapbox styling.
    map.addLayer({
      id: 'archive-invisible-hit-target', type: 'circle', source: 'courses',
      paint: { 'circle-radius': 12, 'circle-opacity': 0, 'circle-stroke-opacity': 0 }
    });
    const interactiveLayers = ['archive-invisible-hit-target'];
    function onCourseClick(e) {
      const feature = e.features && e.features[0];
      if (!feature) return;
      let selected = feature.properties;
      // Use archive metadata even when Studio's source properties differ.
      const coords = feature.geometry.coordinates.slice();
      if (!selected || !selected.Course) {
        const nearby = courseData.features.find(f =>
          Math.abs(f.geometry.coordinates[0] - coords[0]) < 0.001 &&
          Math.abs(f.geometry.coordinates[1] - coords[1]) < 0.001);
        if (nearby) selected = nearby.properties;
      }
      if (!selected || !selected.Course) return;
      showCourse(selected);
      map.flyTo({ center: coords, zoom: Math.max(map.getZoom(), 7), speed: 0.8 });
    }
    interactiveLayers.forEach(id => {
      map.on('click', id, onCourseClick);
      map.on('mouseenter', id, () => { map.getCanvas().style.cursor = 'pointer'; });
      map.on('mouseleave', id, () => { map.getCanvas().style.cursor = ''; });
    });

    // Start by showing the first course in the spreadsheet.
    if (courseData.features.length) showCourse(courseData.features[0].properties);
  });
